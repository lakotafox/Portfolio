<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLCC Teach-Out Hub</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --line: #2b3442;
    --text: #d6dde6; --dim: #8b98a8; --accent: #4da3ff; --warn: #ffb454;
    --danger: #ff6b6b; --ok: #5fd68b; --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, "Segoe UI", sans-serif; padding: 24px 16px 80px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  header h1 { font-size: 22px; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 13px; font-family: var(--mono); }
  header .sub b { color: var(--warn); font-weight: 600; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 24px; position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 5; border-bottom: 1px solid var(--line); }
  nav button { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-family: var(--mono); }
  nav button.active { color: var(--text); border-color: var(--accent); background: var(--panel2); }
  section { display: none; }
  section.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin-bottom: 10px; letter-spacing: .4px; }
  .card h2 .tag { font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 8px; }
  .due-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 6px; border-top: 1px solid var(--line); cursor: pointer; }
  .due-row:first-of-type { border-top: none; }
  .due-row input { margin-top: 4px; accent-color: var(--ok); cursor: pointer; }
  .due-row.done .txt { text-decoration: line-through; color: var(--dim); }
  .due-when { font-family: var(--mono); font-size: 12px; min-width: 88px; padding-top: 2px; }
  .due-when.overdue { color: var(--danger); font-weight: 700; }
  .due-when.today { color: var(--danger); }
  .due-when.soon { color: var(--warn); }
  .due-when.later { color: var(--dim); }
  .due-course { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .pts { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .note { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .note.hot { color: var(--warn); }
  .note a, .golink { color: var(--accent); font-family: var(--mono); font-size: 12px; text-decoration: none; }
  .note a:hover, .golink:hover { text-decoration: underline; }
  .golink { margin-left: 8px; white-space: nowrap; }
  .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
  .course-card h3 { font-size: 14px; }
  .course-card .fills { color: var(--ok); font-size: 12px; font-family: var(--mono); margin-bottom: 6px; }
  .course-card ul { list-style: none; margin-top: 8px; }
  .course-card li { font-size: 13px; color: var(--dim); padding: 3px 0; }
  .course-card li.hot { color: var(--warn); }
  .course-card a { color: var(--accent); font-size: 12px; font-family: var(--mono); text-decoration: none; }
  .course-card a:hover { text-decoration: underline; }
  .bar { background: var(--panel2); border-radius: 6px; height: 14px; overflow: hidden; margin: 6px 0 2px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar i.g { background: var(--ok); }
  .bar-label { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  /* flashcards */
  .deck-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .deck-picker button { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .deck-picker button.active { border-color: var(--ok); }
  .fc { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; min-height: 190px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 26px; font-size: 17px; cursor: pointer; user-select: none; }
  .fc .side-label { display: block; font-family: var(--mono); font-size: 11px; color: var(--dim); margin-bottom: 10px; }
  .fc-controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .fc-controls button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
  .fc-controls button.got { border-color: var(--ok); color: var(--ok); }
  .fc-controls button.again { border-color: var(--warn); color: var(--warn); }
  .fc-progress { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); }
  th { color: var(--dim); font-family: var(--mono); font-size: 11px; font-weight: 400; border-top: none; }
  td.k { font-family: var(--mono); white-space: nowrap; }
  .marker { font-family: var(--mono); }
  .m-warn { color: var(--warn); } .m-ok { color: var(--ok); } .m-danger { color: var(--danger); }
  footer { color: var(--dim); font-size: 11px; font-family: var(--mono); margin-top: 30px; text-align: center; }
  .links a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 12px; margin-right: 14px; }
  .tw { overflow-x: auto; }
  @media (max-width: 560px) {
    body { padding: 14px 8px 60px; font-size: 14px; }
    .due-row { flex-wrap: wrap; }
    .due-when { min-width: 0; }
    .fc { min-height: 150px; font-size: 15px; padding: 18px; }
    nav button { padding: 6px 10px; font-size: 12px; }
    header h1 { font-size: 18px; }
  }
</style>
</head>

</div>

const SECTIONS = [["now","NOW"],["courses","COURSES"],["study","STUDY"],["dates","DATES"],["degree","DEGREE"],["money","MONEY"]];
const $ = id => document.getElementById(id);
const LS = k => "slccHub." + k;

document.getElementById("headline").innerHTML = HUB_DATA.headline.replace(/\(!\)[^|]*$/, m => "<b>" + m + "</b>");
$("stamp").textContent = "data updated " + HUB_DATA.updated + " - Claude refreshes this file on every sweep";

// nav
SECTIONS.forEach(([key, label], i) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll("section").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    $("sec-" + key).classList.add("active");
    localStorage.setItem(LS("tab"), key);
  };
  $("nav").appendChild(b);
});
const savedTab = localStorage.getItem(LS("tab")) || "now";
const idx = Math.max(0, SECTIONS.findIndex(s => s[0] === savedTab));
$("nav").children[idx].click();

// queue
function daysLeft(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(d + "T00:00:00") - today) / 86400000);
}
function whenLabel(d) {
  const n = daysLeft(d);
  if (n < 0) return [`${-n}d OVERDUE`, "overdue"];
  if (n === 0) return ["DUE TODAY", "today"];
  if (n === 1) return ["tomorrow", "soon"];
  if (n <= 3) return [`in ${n} days`, "soon"];
  return [new Date(d + "T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}), "later"];
}
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
function appLink(url) {
  // Canvas Student app URL scheme - only meaningful for instructure.com links
  return /^https:\/\/slcc\.instructure\.com/.test(url) ? url.replace(/^https:\/\//, "canvas-courses://") : null;
}
HUB_DATA.queue.forEach(item => {
  const row = document.createElement("label");
  row.className = "due-row";
  const done = localStorage.getItem(LS("done." + item.id)) === "1";
  if (done) row.classList.add("done");
  const [w, cls] = whenLabel(item.due);
  row.innerHTML = `<input type="checkbox" ${done ? "checked" : ""}>
    <span class="due-when ${done ? "later" : cls}">${done ? "[x] done" : w}</span>
    <span class="txt"><span class="due-course">${item.course}</span> ${item.txt}
      ${item.pts ? `<span class="pts">(${item.pts} pts)</span>` : ""}
      ${item.link ? `<a class="golink" href="${item.link}" target="_blank">open -></a>` : ""}
      ${item.link && IS_MOBILE && appLink(item.link) ? `<a class="golink" href="${appLink(item.link)}">app -></a>` : ""}
      ${item.note ? `<div class="note ${item.note.startsWith("(!)") ? "hot" : ""}">${item.note}</div>` : ""}
    </span>`;
  row.querySelectorAll("a").forEach(a => a.addEventListener("click", e => e.stopPropagation()));
  row.querySelector("input").onchange = e => {
    localStorage.setItem(LS("done." + item.id), e.target.checked ? "1" : "0");
    row.classList.toggle("done", e.target.checked);
    row.querySelector(".due-when").textContent = e.target.checked ? "[x] done" : whenLabel(item.due)[0];
  };
  $("queue").appendChild(row);
});

// watches
HUB_DATA.watches.forEach(w => {
  const d = document.createElement("div");
  d.style.padding = "6px 0";
  d.innerHTML = `<span class="marker ${w.cls}">${w.marker}</span> <span style="font-size:13px">${w.txt}</span>`;
  $("watches").appendChild(d);
});

// courses
HUB_DATA.courses.forEach(c => {
  const d = document.createElement("div");
  d.className = "card course-card";
  d.innerHTML = `<h3>${c.name}</h3>
    <div style="color:var(--dim);font-size:12px;font-family:var(--mono)">${c.sect}</div>
    <div class="fills">-> ${c.fills}</div>
    <ul>${c.items.map(i => `<li class="${i.hot ? "hot" : ""}">${i.hot ? "(!)" : "-"} ${i.t}</li>`).join("")}</ul>
    <div style="margin-top:8px"><a href="${c.url}" target="_blank">open in Canvas -></a>
      ${IS_MOBILE ? `<a href="${c.url.replace(/^https:\/\//, "canvas-courses://")}" style="margin-left:10px">app -></a>` : ""}</div>`;
  $("courses").appendChild(d);
});

// flashcards
let deckName = null, order = [], pos = 0, showBack = false;
function retiredKey() { return LS("retired." + deckName); }
function getRetired() { try { return new Set(JSON.parse(localStorage.getItem(retiredKey()) || "[]")); } catch { return new Set(); } }
function setRetired(s) { localStorage.setItem(retiredKey(), JSON.stringify([...s])); }
function buildOrder() {
  const retired = getRetired();
  order = HUB_DATA.decks[deckName].map((_, i) => i).filter(i => !retired.has(i));
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; showBack = false;
}
function renderCard() {
  const total = HUB_DATA.decks[deckName].length, left = order.length;
  if (!left) { $("fc").innerHTML = `<span><span class="side-label">DECK CLEAR</span>All ${total} cards retired. Hit "reset deck" to run it again.</span>`; $("fcp").textContent = `${total}/${total} retired`; return; }
  const card = HUB_DATA.decks[deckName][order[pos % order.length]];
  $("fc").innerHTML = `<span><span class="side-label">${showBack ? "ANSWER" : "QUESTION"}</span>${showBack ? card[1] : card[0]}</span>`;
  $("fcp").textContent = `${total - left} of ${total} retired - ${left} in rotation`;
}
Object.keys(HUB_DATA.decks).forEach((name, i) => {
  const b = document.createElement("button");
  b.textContent = name + ` (${HUB_DATA.decks[name].length})`;
  b.onclick = () => {
    document.querySelectorAll(".deck-picker button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    deckName = name; buildOrder(); renderCard();
  };
  $("decks").appendChild(b);
  if (i === 0) b.click();
});
$("fc").onclick = () => { if (deckName && order.length) { showBack = !showBack; renderCard(); } };
$("flip").onclick = $("fc").onclick;
$("got").onclick = () => {
  if (!deckName || !order.length) return;
  const r = getRetired(); r.add(order[pos % order.length]); setRetired(r);
  order.splice(pos % order.length, 1); showBack = false; renderCard();
};
$("again").onclick = () => { if (!deckName || !order.length) return; pos++; showBack = false; renderCard(); };
$("reset").onclick = () => { if (!deckName) return; setRetired(new Set()); buildOrder(); renderCard(); };

// dates
$("dates").innerHTML = "<tr><th>DATE</th><th>WHAT</th></tr>" + HUB_DATA.dates.map(([d, w]) =>
  `<tr><td class="k ${d.startsWith("(!)") ? "m-warn marker" : ""}">${d}</td><td>${w}</td></tr>`).join("");

// degree
(function () {
  const g = HUB_DATA.degree, el = $("degree");
  [g.total, g.genEd, g.csis].forEach(x => {
    const pct = Math.round(100 * x.done / x.target);
    el.innerHTML += `<div style="margin-bottom:12px"><div class="bar"><i class="${pct >= 75 ? "g" : ""}" style="width:${pct}%"></i></div>
      <div class="bar-label">${x.label} - ${pct}%</div></div>`;
  });
  el.innerHTML += `<div class="note" style="margin-top:10px"><span class="marker m-ok">-></span> ${g.springPlan}</div>`;
})();

// money
$("money").innerHTML = "<table>" + HUB_DATA.money.map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join("") + "</table>";
</script>
</body>
</html>
