<!doctype html>
<html lang="en" data-foxbox-web="host">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoxBox</title>
    <style>
      /*
        Sky Scramble PARTY MODE — the TV host page (served at / by tools/party-server.ts).
        Phones are the controllers (/pad). This page runs the real game module
        (build/gc.game.js, which appends its own full-window <canvas>) and mocks the
        Gaming Couch platform around it: lobby, HUD (scoreboard + overhead name tags),
        results. Designed for 1920×1080 seen from the couch.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #0b0d12;
        color: #fff;
        font-family: "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, sans-serif;
        overflow: hidden;
        cursor: none; /* the TV never needs a mouse pointer */
        user-select: none;
      }
      /* Root font scales with the window so the layout holds at any TV/window size
         (16px at 1920 wide). */
      html {
        font-size: min(0.8333vw, 1.4815vh);
      }

      .screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
      }
      .screen.show {
        display: flex;
      }

      /* ── Lobby ──────────────────────────────────────────────────────────── */
      #lobby {
        flex-direction: column;
        align-items: center;
        padding: 3rem 5rem 2.5rem;
        box-sizing: border-box;
        background:
          radial-gradient(60rem 30rem at 15% 105%, rgba(255, 255, 255, 0.55), transparent 60%),
          radial-gradient(50rem 22rem at 90% 100%, rgba(255, 255, 255, 0.45), transparent 60%),
          linear-gradient(180deg, #3d8bfd 0%, #6fb3ff 45%, #bfe3ff 100%);
        overflow: hidden;
      }
      .cloud {
        position: absolute;
        background: #fff;
        border-radius: 999px;
        opacity: 0.8;
        filter: blur(0.15rem);
        animation: drift 40s linear infinite;
      }
      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: #fff;
        border-radius: 50%;
      }
      .cloud::before {
        width: 45%;
        height: 160%;
        left: 15%;
        bottom: 20%;
      }
      .cloud::after {
        width: 35%;
        height: 130%;
        right: 15%;
        bottom: 25%;
      }
      @keyframes drift {
        from {
          transform: translateX(-30rem);
        }
        to {
          transform: translateX(130rem);
        }
      }
      .title {
        position: relative;
        margin: 0;
        font-size: 8.5rem;
        line-height: 1;
        letter-spacing: 0.02em;
        color: #fff;
        text-shadow:
          0 0.45rem 0 #1d5fd1,
          0 0.9rem 1.5rem rgba(0, 40, 120, 0.35);
        transform: rotate(-2deg);
      }
      .tagline {
        position: relative;
        margin: 0.6rem 0 0;
        font-size: 1.8rem;
        color: #0e3a86;
      }
      .lobby-main {
        position: relative;
        flex: 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5rem;
        min-height: 0;
      }
      .join-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #fff;
        color: #12325f;
        border-radius: 2.5rem;
        padding: 2.2rem 2.6rem 1.8rem;
        box-shadow: 0 1.2rem 3rem rgba(0, 40, 120, 0.3);
      }
      .join-card h2 {
        margin: 0 0 1rem;
        font-size: 2.8rem;
      }
      #qr {
        width: 26rem;
        height: 26rem;
        image-rendering: pixelated;
      }
      #pad-url {
        margin-top: 1rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-weight: 700;
        font-size: 2rem;
        letter-spacing: 0.02em;
      }
      /* web version: the room code under the QR */
      .join-card.web {
        padding: 1.6rem 2.4rem 1.6rem;
      }
      .join-card.web h2 {
        font-size: 2.3rem;
        margin-bottom: 0.6rem;
      }
      .join-card.web #qr {
        width: 18rem;
        height: 18rem;
      }
      #join-hint {
        margin-top: 0.6rem;
        font-size: 1.7rem;
        color: #33507f;
      }
      #room-code {
        margin-top: 0.4rem;
        font-size: 6.4rem;
        letter-spacing: 0.18em;
        line-height: 1;
        color: #ff5a3c;
        text-shadow: 0 0.3rem 0 #c7361d22;
      }
      .players-panel {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        width: 62rem;
      }
      .players-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 2.6rem;
        color: #0e3a86;
      }
      .players-head .count {
        font-size: 2.2rem;
        opacity: 0.8;
      }
      #chips {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.2rem;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        height: 7.4rem;
        padding: 0 1.6rem;
        border-radius: 4rem;
        background: var(--c);
        color: #fff;
        font-size: 3rem;
        text-shadow: 0 0.15rem 0.3rem rgba(0, 0, 0, 0.35);
        box-shadow:
          inset 0 -0.5rem 0 var(--d),
          0 0.6rem 1.2rem rgba(0, 30, 90, 0.25);
        box-sizing: border-box;
        overflow: hidden;
        animation: pop 0.35s cubic-bezier(0.3, 1.6, 0.6, 1);
      }
      .chip .ball {
        flex: none;
        width: 4.6rem;
        height: 4.6rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--l), var(--c) 55%, var(--d));
        border: 0.3rem solid rgba(255, 255, 255, 0.85);
        position: relative;
      }
      .chip .ball::before,
      .chip .ball::after {
        content: "";
        position: absolute;
        top: 1.5rem;
        width: 0.7rem;
        height: 1.1rem;
        border-radius: 50%;
        background: #111;
      }
      .chip .ball::before {
        left: 1.25rem;
      }
      .chip .ball::after {
        right: 1.25rem;
      }
      /* drawn character pick: a little portrait in the player's colour ring */
      .chip .thumb {
        flex: none;
        width: 4.6rem;
        height: 6.2rem;
        border-radius: 1.4rem;
        background: #fff;
        border: 0.35rem solid var(--l);
        box-shadow: 0 0 0 0.25rem var(--d);
        overflow: hidden;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .chip .thumb.round {
        width: 4.6rem;
        height: 4.6rem;
        border-radius: 50%;
        background-color: #fff;
        background-repeat: no-repeat;
      }
      .chip .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 0;
      }
      .chip .nm {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip .tag {
        flex: none;
        font-size: 1.6rem;
        padding: 0.35rem 0.9rem;
        border-radius: 1rem;
        background: rgba(0, 0, 0, 0.25);
      }
      .chip .tag.drawing {
        background: rgba(255, 255, 255, 0.92);
        color: #12325f;
        text-shadow: none;
        animation: drawing-pulse 1.4s ease-in-out infinite;
      }
      @keyframes drawing-pulse {
        50% {
          opacity: 0.55;
        }
      }
      .chip.off {
        opacity: 0.45;
        filter: grayscale(0.6);
      }
      /* Row Row Rumble v2: a chip per boat seat (boat colour); empty seats go to bots */
      .chip.seat .seat-person {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 1;
        min-width: 0;
        gap: 0.3rem;
      }
      .chip.seat .nm {
        flex: 1;
        width: 100%;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip.seat .tag {
        font-size: 1.4rem;
        line-height: 1.2;
      }
      .chip.botseat {
        opacity: 0.55;
        filter: saturate(0.6);
      }
      .chip.empty {
        background: rgba(255, 255, 255, 0.25);
        border: 0.3rem dashed rgba(255, 255, 255, 0.85);
        box-shadow: none;
        color: rgba(14, 58, 134, 0.6);
        text-shadow: none;
        font-size: 2.2rem;
        justify-content: center;
        animation: none;
      }
      @keyframes pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
      }
      .start-bar {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
      }
      #start-text {
        font-size: 4.2rem;
        color: #fff;
        background: #ff5a3c;
        padding: 1.2rem 3.2rem;
        border-radius: 3rem;
        box-shadow:
          inset 0 -0.6rem 0 #c7361d,
          0 0.8rem 1.6rem rgba(120, 30, 0, 0.3);
        animation: pulse 1.4s ease-in-out infinite;
      }
      #start-text.idle {
        background: #2f6fd8;
        box-shadow:
          inset 0 -0.6rem 0 #1d4fa8,
          0 0.8rem 1.6rem rgba(0, 30, 90, 0.3);
        animation: none;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.04);
        }
      }
      #auto-text {
        font-size: 2.2rem;
        color: #0e3a86;
        min-height: 2.8rem;
      }
      #net-status {
        position: absolute;
        right: 2rem;
        top: 1.6rem;
        font-size: 1.6rem;
        color: #0e3a86;
        opacity: 0.85;
      }
      #net-status.bad {
        color: #b3001b;
        opacity: 1;
        background: #fff;
        padding: 0.6rem 1.2rem;
        border-radius: 1rem;
      }
      #sound-hint {
        position: absolute;
        left: 2rem;
        top: 1.6rem;
        font-size: 1.6rem;
        color: #0e3a86;
        opacity: 0.85;
      }

      /* ── Countdown ─────────────────────────────────────────────────────── */
      #countdown {
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: linear-gradient(180deg, #3d8bfd 0%, #6fb3ff 45%, #bfe3ff 100%);
        z-index: 40;
      }
      #cd-num {
        font-size: 22rem;
        line-height: 1;
        color: #fff;
        text-shadow:
          0 0.8rem 0 #1d5fd1,
          0 1.5rem 3rem rgba(0, 0, 0, 0.4);
        animation: cd 1s ease-out infinite;
      }
      #cd-sub {
        font-size: 3.4rem;
        margin-top: 2rem;
        text-shadow: 0 0.2rem 0.6rem rgba(0, 0, 0, 0.6);
      }
      @keyframes cd {
        from {
          transform: scale(1.4);
          opacity: 0.3;
        }
        30% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ── Results ───────────────────────────────────────────────────────── */
      /* Results: an arcade high-score screen (the pixel look). The winner's puffball wears the crown. */
      #results {
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background-color: #05070f;
        background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 0.3rem, transparent 0.3rem 0.6rem);
        z-index: 40;
        font-family: "FoxBox Pixel", ui-monospace, monospace;
      }
      #res-title {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.4rem;
        font-size: 4.4rem;
        font-weight: 400;
        line-height: 1.3;
        color: #35d07f;
        text-align: center;
      }
      .px-sprite {
        display: block;
        flex: none;
      }
      .px-crowned {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .res-cursor {
        animation: res-blink 1s steps(1, end) infinite;
      }
      @keyframes res-blink {
        50% { opacity: 0; }
      }
      #res-list {
        margin-top: 4rem;
        width: min(120rem, 88vw);
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
        font-size: 2.2rem;
      }
      .res-row {
        display: grid;
        grid-template-columns: 10rem 18rem minmax(0, 1fr);
        align-items: baseline;
        gap: 2.4rem;
        color: #ffffff;
      }
      #res-list.solo .res-row {
        grid-template-columns: 10rem minmax(0, 1fr);
      }
      /* a game's score column (gameOver extra.values, TEE TIME: "247 PTS") */
      #res-list.solo.vals .res-row {
        grid-template-columns: 10rem minmax(0, 1fr) 20rem;
      }
      .res-row .val {
        text-align: right;
      }
      .res-row.res-hd {
        color: #6c7a99;
        font-size: 1.6rem;
      }
      .res-row.first {
        color: #ffd23f;
      }
      .res-row .crew {
        font-family: "FoxBox Soft", ui-rounded, system-ui, sans-serif;
        font-size: 2.8rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #res-sub {
        margin-top: 4.4rem;
        font-size: 1.8rem;
        line-height: 1.6;
        color: #35d07f;
        text-align: center;
      }
      /* the winner's crowned puffball hops in pixel steps: squash on landing, ~5 sprite pixels up,
         the crown a pixel behind on the way up, always on the head (pixel-art.js crownedPuff) */
      .px-hop {
        transform-origin: 50% 100%;
        animation: px-hop 0.9s steps(1, end) infinite;
      }
      #res-title .px-hop {
        margin-top: calc(var(--px) * 5);
      }
      .px-hop .px-crown {
        animation: px-crown-bob 0.9s steps(1, end) infinite;
      }
      /* the crown sits on the head: two puff pixels down over it, drawn on top */
      .px-crowned .px-crown {
        position: relative;
        z-index: 1;
        margin-bottom: calc(var(--px, 4px) * -2);
      }
      @keyframes px-hop {
        0% { transform: translateY(0) scale(1.1, 0.9); }
        11% { transform: translateY(0) scale(1, 1); }
        22% { transform: translateY(calc(var(--px) * -2)) scale(0.95, 1.06); }
        33% { transform: translateY(calc(var(--px) * -4)) scale(1, 1); }
        44% { transform: translateY(calc(var(--px) * -5)) scale(1, 1); }
        55% { transform: translateY(calc(var(--px) * -5)) scale(1, 1); }
        66% { transform: translateY(calc(var(--px) * -4)) scale(1, 1); }
        77% { transform: translateY(calc(var(--px) * -2)) scale(0.95, 1.06); }
        88%, 100% { transform: translateY(0) scale(1.1, 0.9); }
      }
      /* the crown lags a pixel on the way up (sits deeper on the head), never lifts off it */
      @keyframes px-crown-bob {
        0%, 11% { transform: translateY(0); }
        22%, 33% { transform: translateY(var(--cpx, 2px)); }
        44%, 100% { transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .res-cursor,
        .px-hop,
        .px-hop .px-crown { animation: none; }
      }

      /* ── Sky Scramble setup: who's ready, a pixel panel over the lobby screens under the join card
         (host.js places and fills it; Row's seats lobby has its own) ── */
      #sky-ready {
        position: fixed;
        z-index: 65;
        left: 48px;
        top: 700px;
        width: 330px;
        box-sizing: border-box;
        padding: 16px 16px 18px;
        overflow: hidden;
        background: #0d1322;
        color: #fff;
        box-shadow: 0 -4px 0 0 #0a1428, 0 4px 0 0 #0a1428, -4px 0 0 0 #0a1428, 4px 0 0 0 #0a1428, 0 10px 0 0 #040a188c, inset 0 4px 0 0 #ffffff14, inset 0 -4px 0 0 #00000038;
        font-family: "FoxBox Pixel", ui-monospace, monospace;
        pointer-events: none;
      }
      #sky-ready[hidden] {
        display: none;
      }
      #sky-ready .sr-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 14px;
        font-size: 13px;
        line-height: 1.4;
        color: #ffd23f;
        text-shadow: 3px 3px 0 #0a1428;
      }
      #sky-ready .sr-count {
        color: #ffffff;
      }
      #sky-ready.all .sr-count {
        color: #35d07f;
      }
      #sky-ready ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #sky-ready li {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 4px 8px 4px 4px;
        background: #00000038;
      }
      #sky-ready li.away {
        opacity: 0.45;
      }
      #sky-ready .sr-pic {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(180deg, #4a82e8 0 40%, #6198f0 40% 72%, #81b0f6 72%);
      }
      #sky-ready .sr-pic img {
        max-width: 92%;
        max-height: 92%;
        object-fit: contain;
      }
      #sky-ready .sr-pic .round {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background-color: #fff;
        background-repeat: no-repeat;
      }
      #sky-ready .sr-pic .px-sprite {
        width: 32px;
        height: 32px;
      }
      #sky-ready .sr-name {
        font-family: "FoxBox Soft", ui-rounded, system-ui, sans-serif;
        font-weight: 700;
        font-size: 22px;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #sky-ready .sr-badge {
        font-size: 10px;
        line-height: 1;
        padding: 6px 7px;
        white-space: nowrap;
        color: #0a1428;
        background: #c9d2e6;
        box-shadow: 0 -2px 0 0 #0a1428, 0 2px 0 0 #0a1428, -2px 0 0 0 #0a1428, 2px 0 0 0 #0a1428;
      }
      #sky-ready .ready .sr-badge {
        background: #35d07f;
      }
      #sky-ready .picking .sr-badge {
        background: #ffd23f;
      }
      #sky-ready .drawing .sr-badge {
        background: #6a3fd0;
        color: #ffffff;
      }
      #sky-ready .sr-hint {
        margin-top: 16px;
        font-size: 9px;
        line-height: 1.7;
        color: #8d9bbb;
      }
      /* ── TEE TIME setup: the MAP panel (same pixel panel as Sky's ready check; host.js places and fills it) ── */
      #golf-map {
        position: fixed;
        z-index: 65;
        left: 48px;
        top: 700px;
        width: 330px;
        box-sizing: border-box;
        padding: 16px 16px 18px;
        background: #0d1322;
        color: #fff;
        box-shadow: 0 -4px 0 0 #0a1428, 0 4px 0 0 #0a1428, -4px 0 0 0 #0a1428, 4px 0 0 0 #0a1428, 0 10px 0 0 #040a188c, inset 0 4px 0 0 #ffffff14, inset 0 -4px 0 0 #00000038;
        font-family: "FoxBox Pixel", ui-monospace, monospace;
        pointer-events: none;
      }
      #golf-map[hidden] {
        display: none;
      }
      /* BOTS: FILL / OFF (the host's setting for every game): a small label by the party info (web: under the
         multi-TV party chip), clickable on a TV with a mouse */
      #bots-toggle {
        position: fixed;
        z-index: 96;
        left: 1.5rem;
        top: 1.5rem;
        padding: 0.45rem 0.75rem;
        border: 0.2rem solid #fff9f1;
        background: #101125e6;
        color: #fff9f1;
        box-shadow: 0 0.3rem 0 #08091980;
        font: 0.75rem/1.3 "FoxBox Pixel", ui-monospace, monospace;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      #bots-toggle[hidden] {
        display: none;
      }
      #bots-toggle[data-mode="fill"] {
        color: #ffd23f;
      }
      #bots-toggle.bt-ro {
        cursor: default;
      }
      .bot-tag {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        background: #3a4466;
        color: #dfe6ff;
        font-size: 0.55em;
        letter-spacing: 0.08em;
        vertical-align: 0.2em;
      }
      #golf-map .gm-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 13px;
        line-height: 1.4;
        color: #ffd23f;
        text-shadow: 3px 3px 0 #0a1428;
      }
      #golf-map .gm-who {
        color: #ffffff;
        font-size: 10px;
      }
      #golf-map .gm-pic {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        image-rendering: pixelated;
        box-shadow: 0 0 0 4px #0a1428;
      }
      #golf-map .gm-name {
        margin-top: 14px;
        font-size: 18px;
        line-height: 1.3;
        text-align: center;
        color: #ffd23f;
        text-shadow: 3px 3px 0 #0a1428;
      }
      #golf-map .gm-pips {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }
      #golf-map .gm-pips i {
        width: 12px;
        height: 12px;
        background: #3a4466;
        box-shadow: 0 0 0 2px #0a1428;
      }
      #golf-map .gm-pips i.on {
        background: #ffd23f;
      }
      #golf-map .gm-hint {
        margin-top: 14px;
        font-size: 9px;
        line-height: 1.7;
        color: #8d9bbb;
        text-align: center;
      }
      /* five or more players: compact rows so eight still fit under the join card */
      #sky-ready.many {
        padding: 12px 14px 14px;
      }
      #sky-ready.many .sr-head {
        margin-bottom: 10px;
      }
      #sky-ready.many li {
        grid-template-columns: 30px minmax(0, 1fr) auto;
        min-height: 32px;
        gap: 10px;
        padding: 1px 8px 1px 1px;
      }
      #sky-ready.many ol {
        gap: 5px;
      }
      #sky-ready.many .sr-pic {
        width: 30px;
        height: 30px;
      }
      #sky-ready.many .sr-pic .round {
        width: 26px;
        height: 26px;
      }
      #sky-ready.many .sr-pic .px-sprite {
        width: 24px;
        height: 24px;
      }
      #sky-ready.many .sr-name {
        font-size: 18px;
      }
      #sky-ready.many .sr-badge {
        font-size: 9px;
        padding: 4px 6px;
      }
      #sky-ready.many .sr-hint {
        display: none;
      }
      /* ── KNIGHT (Knight Platformer) setup: LEVEL + READY CHECK, the same pixel panel as Sky's (host.js renderKnightSetup) ── */
      #knight-setup {
        position: fixed;
        z-index: 65;
        left: 48px;
        top: 700px;
        width: 330px;
        box-sizing: border-box;
        padding: 14px 16px 16px;
        overflow: hidden;
        background: #0d1322;
        color: #fff;
        box-shadow: 0 -4px 0 0 #0a1428, 0 4px 0 0 #0a1428, -4px 0 0 0 #0a1428, 4px 0 0 0 #0a1428, 0 10px 0 0 #040a188c, inset 0 4px 0 0 #ffffff14, inset 0 -4px 0 0 #00000038;
        font-family: "FoxBox Pixel", ui-monospace, monospace;
        pointer-events: none;
      }
      #knight-setup[hidden] { display: none; }
      #knight-setup .ks-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; font-size: 13px; line-height: 1.4; color: #ffd23f; text-shadow: 3px 3px 0 #0a1428; }
      #knight-setup .ks-who { color: #ffffff; font-size: 10px; }
      #knight-setup .ks-level { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; align-items: center; }
      #knight-setup .ks-thumb { display: block; width: 128px; height: 72px; image-rendering: pixelated; box-shadow: 0 0 0 4px #0a1428; }
      #knight-setup .ks-lvname { font-size: 14px; line-height: 1.5; color: #ffd23f; text-shadow: 3px 3px 0 #0a1428; }
      #knight-setup .ks-others { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 0; }
      #knight-setup .ks-other { font-size: 8px; line-height: 1.6; color: #8d9bbb; }
      #knight-setup .ks-other b { margin-left: 8px; padding: 2px 5px; font-weight: 400; color: #0a1428; background: #6c7a99; }
      #knight-setup .ks-rhead { margin-top: 16px; }
      #knight-setup .ks-count { color: #ffffff; }
      #knight-setup.all .ks-count { color: #35d07f; }
      #knight-setup ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
      #knight-setup li { display: grid; grid-template-columns: 51px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 54px; padding: 2px 8px 2px 2px; background: #00000038; }
      #knight-setup li.away { opacity: 0.45; }
      #knight-setup .ks-pic { display: block; width: 51px; height: 51px; image-rendering: pixelated; background: linear-gradient(180deg, #0f1d3c 0 60%, #18294f 60%); box-shadow: inset 0 -3px 0 0 var(--kc, #ffd23f); }
      #knight-setup .ks-who2 { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      #knight-setup .ks-name { font-family: "FoxBox Soft", ui-rounded, system-ui, sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; color: var(--kc, #ffffff); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 2px 2px 0 #0a1428; }
      #knight-setup .ks-what { font-size: 7px; line-height: 1.4; color: #8d9bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #knight-setup .ks-badge { font-size: 10px; line-height: 1; padding: 6px 7px; white-space: nowrap; color: #0a1428; background: #c9d2e6; box-shadow: 0 -2px 0 0 #0a1428, 0 2px 0 0 #0a1428, -2px 0 0 0 #0a1428, 2px 0 0 0 #0a1428; }
      #knight-setup .ready .ks-badge { background: #35d07f; }
      #knight-setup .picking .ks-badge { background: #ffd23f; }
      #knight-setup .bot .ks-badge { background: #8d9bbb; }
      #knight-setup li.bot { background: #0000001f; }
      #knight-setup .ks-hint { margin-top: 14px; font-size: 9px; line-height: 1.7; color: #8d9bbb; }
      /* five or more players: two columns (badge under the name) so eight still fit under the join card */
      #knight-setup.many ol { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 8px; }
      #knight-setup.many li { grid-template-columns: 51px minmax(0, 1fr); gap: 8px; padding-right: 4px; }
      #knight-setup.many .ks-level { grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
      #knight-setup.many .ks-thumb { width: 96px; height: 54px; }
      #knight-setup.many .ks-lvname { font-size: 12px; }
      #knight-setup.many .ks-others { flex-direction: row; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; }
      #knight-setup.many .ks-other { font-size: 7px; }
      #knight-setup.many .ks-rhead { margin-top: 12px; }
      #knight-setup.many .ks-name { font-size: 17px; }
      #knight-setup.many .ks-what { display: none; }
      #knight-setup.many .ks-badge { grid-column: 2; grid-row: 1; align-self: end; justify-self: start; margin-bottom: 4px; font-size: 7px; padding: 3px 4px; }
      #knight-setup.many .ks-who2 { grid-column: 2; grid-row: 1; align-self: start; margin-top: 6px; }
      #knight-setup.many .ks-hint { display: none; }
      #knight-setup.crowd { padding: 12px 14px 12px; }
      #knight-setup.crowd .ks-others { display: none; }
      #knight-setup.crowd .ks-level { grid-template-columns: 80px minmax(0, 1fr); }
      #knight-setup.crowd .ks-thumb { width: 80px; height: 45px; }
      #knight-setup.crowd .ks-head { margin-bottom: 8px; }
      #knight-setup.crowd .ks-rhead { margin-top: 10px; }
      #knight-setup.crowd ol { gap: 5px 8px; }
      #knight-setup.crowd li { grid-template-columns: 40px minmax(0, 1fr); min-height: 44px; }
      #knight-setup.crowd .ks-pic { width: 40px; height: 40px; }
      #knight-setup.crowd .ks-name { font-size: 16px; }
      /* ── end KNIGHT ── */

      /* ── In-round HUD (the platform's HUD, mocked; TV-sized) ───────────── */
      #hud {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        display: none;
      }
      #hud.show {
        display: block;
      }
      #scoreboard {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .player-box {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        width: 11.5rem;
        padding: 0.6rem 0.9rem;
        background: rgba(17, 20, 28, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-left: 0.6rem solid var(--c);
        border-radius: 0.8rem;
        box-sizing: border-box;
      }
      .player-box .name {
        font-size: 1.5rem;
        color: var(--c);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        filter: brightness(1.25);
      }
      .player-box .score {
        font-size: 1.9rem;
        font-variant-numeric: tabular-nums;
      }
      .player-box .meter {
        height: 0.5rem;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 0.3rem;
        overflow: hidden;
      }
      .player-box .meter-fill {
        height: 100%;
        background: var(--c);
        transition: width 0.15s linear;
      }
      .player-box.eliminated {
        opacity: 0.45;
        border-left-color: #ef4444;
      }
      .player-box.eliminated .name {
        text-decoration: line-through;
        color: #ef4444;
      }
      /* TEE TIME draws its own HUD into a 1920x1080 canvas (object-fit: contain, so 120rem x 67.5rem here, centred):
         the mini-game panel top left ends at y 140 (8.75rem), the golfer's turn panel bottom left starts at y 884
         (55.25rem). The player stack stays between the two (1rem clear of each), centred in that band; with 7-8
         players the cards tighten so they all fit (8 regular cards ran into the turn panel). */
      #hud[data-game="golf"] #scoreboard {
        top: calc(50% - 24rem);
        bottom: calc(50% - 20.5rem);
        transform: none;
        justify-content: center;
      }
      #hud[data-game="golf"] #scoreboard.many {
        gap: 0.4rem;
      }
      #hud[data-game="golf"] #scoreboard.many .player-box {
        gap: 0;
        padding: 0.4rem 0.9rem;
      }
      #hud[data-game="golf"] #scoreboard.many .name {
        font-size: 1.3rem;
      }
      #hud[data-game="golf"] #scoreboard.many .score {
        font-size: 1.6rem;
        line-height: 1.15;
      }
      #screen-points {
        position: absolute;
        inset: 0;
      }
      .overhead {
        position: absolute;
        transform: translate(-50%, -100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        white-space: nowrap;
      }
      .overhead .oh-name {
        font-size: 2rem;
        color: #fff;
        padding: 0.1rem 0.8rem;
        border-radius: 0.8rem;
        background: var(--c);
        box-shadow: 0 0.15rem 0.4rem rgba(0, 0, 0, 0.35);
        text-shadow: 0 0.1rem 0.2rem rgba(0, 0, 0, 0.5);
      }
      .overhead .oh-label {
        font-size: 1.1rem;
        line-height: 1;
        color: #fff;
        text-shadow: 0 0.1rem 0.25rem rgba(0, 0, 0, 0.8);
      }
      .overhead .oh-meter {
        width: 6rem;
        height: 0.5rem;
        background: rgba(255, 255, 255, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 0.3rem;
        overflow: hidden;
      }
      .overhead .oh-meter-fill {
        height: 100%;
        background: var(--c);
      }
      .offscreen {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 0.3rem 0.9rem;
        border-radius: 1rem;
        border: 0.3rem solid var(--c);
        background: rgba(11, 13, 18, 0.85);
        font-size: 1.6rem;
        white-space: nowrap;
      }
      .offscreen::before {
        content: "▲ ";
        color: var(--c);
      }
      #paused {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 8rem;
        text-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.6);
        display: none;
      }
      #paused.show {
        display: block;
      }
      /* the hub's game picker line under the title */
      #game-pick {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.8rem;
        margin: 0.4rem 0 0.2rem;
        font-size: 1.5rem;
        font-weight: 800;
      }
      #game-pick .gp-label {
        color: rgba(255, 255, 255, 0.85);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 1.1rem;
      }
      #game-pick .gp-game {
        padding: 0.35rem 1.1rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 0.75);
      }
      #game-pick .gp-game.on {
        background: #fff;
        color: #1f4fbf;
        box-shadow: 0 0.25rem 0 rgba(14, 58, 134, 0.35);
      }
      #game-blurb {
        position: relative;
        margin: 0 0 0.9rem;
        font-size: 1.15rem;
        font-weight: 700;
        color: rgba(14, 58, 134, 0.75);
      }
      #game-pick .gp-hint {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.05rem;
        font-weight: 600;
      }

  <body>
    <!-- LOBBY -->
    <section id="lobby" class="screen show">
      <div class="cloud" style="top: 9rem; width: 22rem; height: 6rem; animation-duration: 55s; animation-delay: -20s"></div>
      <div class="cloud" style="top: 30rem; width: 16rem; height: 4.5rem; animation-duration: 70s; animation-delay: -50s"></div>
      <div class="cloud" style="top: 52rem; width: 26rem; height: 7rem; animation-duration: 62s; animation-delay: -5s"></div>
      <div id="sound-hint"></div>
      <div id="net-status">Connecting…</div>
      <h1 class="title" id="hub-title">FOXBOX</h1>
      <p class="tagline" id="tagline"></p>
      <div id="game-pick"></div>
      <p id="game-blurb"></p>
      <div class="lobby-main">
        <div class="join-card">
          <h2 id="join-title">Scan to play!</h2>
          <canvas id="qr" width="400" height="400"></canvas>
          <div id="pad-url">…</div>
          <div id="join-hint" hidden></div>
          <div id="room-code" hidden></div>
        </div>
        <div class="players-panel">
          <div class="players-head"><span>Players</span><span class="count" id="count">0 / 8</span></div>
          <div id="chips"></div>
        </div>
      </div>
      <div class="start-bar">
        <div id="start-text" class="idle">Scan the code with your phone to join</div>
        <div id="auto-text"></div>
      </div>
    </section>

    <!-- SKY SCRAMBLE SETUP: who's ready (host.js) -->
    <div id="sky-ready" data-test="ready-check" hidden>
      <div class="sr-head"><span>READY CHECK</span><span class="sr-count" id="sky-ready-count"></span></div>
      <ol id="sky-ready-list"></ol>
      <div class="sr-hint">PICK A CHARACTER ON YOUR PHONE, THEN TAP READY</div>
    </div>

    <!-- TEE TIME SETUP: the map the picker chooses on their phone (host.js renderGolfMap) -->
    <div id="golf-map" data-test="golf-map" hidden></div>
    <button id="bots-toggle" type="button" data-test="bots-toggle" hidden></button>
    <!-- KNIGHT (Knight Platformer) SETUP: the level the picker chose + who's ready (host.js renderKnightSetup) -->
    <div id="knight-setup" data-test="knight-setup" hidden></div>

    <!-- COUNTDOWN -->
    <section id="countdown" class="screen">
      <div id="cd-num">3</div>
      <div id="cd-sub">Get ready!</div>
    </section>

    <!-- RESULTS -->
    <section id="results" class="screen" data-test="results">
      <h1 id="res-title"></h1>
      <div id="res-list"></div>
      <div id="res-sub"></div>
    </section>

    <!-- In-round HUD (mock of the Gaming Couch HUD) -->
    <div id="hud">
      <div id="screen-points"></div>
      <div id="scoreboard"></div>
      <div id="paused">Paused</div>
    </div>
