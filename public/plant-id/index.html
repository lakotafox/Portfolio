<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b140e" />
  <title>Plant Identifier</title>
  <meta name="description" content="Capture up to five photos of a plant and get an instant AI identification with a confidence score. Powered by Pl@ntNet." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/plant-id.css" />
</head>
<body class="dark-theme">
  <!-- Animated WebGL background (Strands), mounted by app.js -->
  <div id="bg" class="bg-strands" aria-hidden="true"></div>

  <header class="app-header">
    <h1 class="app-title">Plant Identifier</h1>
    <p class="app-sub">Add up to 5 photos of one plant, then identify it.</p>
    <span id="quota" class="quota-chip" hidden></span>
  </header>

  <main class="app-main">
    <!-- Capture / compose -->
    <section id="composer" class="composer">
      <div id="slots" class="slots"><!-- photo slots injected here --></div>

      <label class="add-photo" id="add-photo">
        <!-- No `capture` attribute: on mobile that would force the camera and hide
             the photo library. Without it the OS lets the user pick an existing
             photo OR take a new one. -->
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <span class="add-photo-icon" aria-hidden="true"></span>
        <span class="add-photo-text">Add photo</span>
      </label>

      <label class="reject-toggle">
        <input id="no-reject" type="checkbox" />
        <span>Still guess if it doesn't look like a plant</span>
      </label>

      <label class="reject-toggle">
        <input id="use-location" type="checkbox" />
        <span>Use my location for better accuracy</span>
      </label>
      <p class="location-hint">
        Narrows results to plants in your region. Turn this off at a botanical garden
        or arboretum, where plants come from all over the world.
      </p>
      <p id="region-status" class="region-status" hidden></p>

      <button id="identify-btn" class="identify-btn" disabled>Identify</button>
      <p id="composer-msg" class="composer-msg" role="alert" hidden></p>
    </section>

    <!-- Busy -->
    <section id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Identifying&hellip;</p>
    </section>

    <!-- Results -->
    <section id="results" class="results" hidden>
      <div id="verdict" class="verdict"><!-- verdict card --></div>

      <details id="candidates-details" class="candidates-details" hidden>
        <summary class="candidates-summary">
          <span class="candidates-summary-label">Other candidates</span>
          <span id="candidates-count" class="candidates-count"></span>
          <span class="candidates-caret" aria-hidden="true"></span>
        </summary>
        <ul id="candidates" class="candidates"><!-- candidate rows --></ul>
      </details>

      <button id="reset-btn" class="reset-btn">Identify another plant</button>
    </section>

    <!-- Error -->
    <section id="error" class="error-state" hidden>
      <p id="error-msg" class="error-msg"></p>
      <button id="error-back" class="reset-btn">Try again</button>
    </section>
  </main>

  <footer class="app-footer">
    <span>Identification by <a href="https://plantnet.org" target="_blank" rel="noopener noreferrer">Pl@ntNet</a></span>
    <a href="/" class="home-link">&larr; Portfolio</a>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
