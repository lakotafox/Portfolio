<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120a20" />
  <title>3D Scanner</title>
  <meta name="description" content="Snap a photo and turn it into a 3D point cloud you can spin, pinch, and export. AI depth estimation running entirely in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4E1;</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/lidar.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="bg" class="bg-strands" aria-hidden="true"></div>

  <header class="app-header">
    <h1 class="app-title">3D Scanner</h1>
    <p class="app-sub">Snap a photo of anything &mdash; spin it in 3D.</p>
  </header>

  <main class="app-main">
    <!-- Capture -->
    <section id="capture" class="capture">
      <div id="viz" class="viz">
        <video id="preview" class="preview" autoplay muted playsinline></video>
        <p id="cam-hint" class="cam-hint">Starting camera&hellip;</p>
      </div>

      <button id="snap-btn" class="snap-btn">Tap to scan</button>

      <label id="upload-label" class="upload-label">
        <input id="file-input" type="file" accept="image/*" hidden />
        <span>or upload a photo</span>
      </label>

      <a id="pro-link" href="./scan.html" class="options-card" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-dim);font-size:0.88rem;">
        <span>&#x1F9E0;</span>
        <span style="flex:1"><strong style="color:var(--text)">Pro mode</strong> &mdash; pair your phone, circle an object, get a real 3D model</span>
        <span id="brain-dot" style="width:9px;height:9px;border-radius:50%;background:#555;flex:none;" title="checking the brains…"></span>
      </a>

      <p id="prep-status" class="prep-status" hidden></p>
      <p id="capture-msg" class="capture-msg" role="alert" hidden></p>
    </section>

    <!-- Model download progress -->
    <section id="model-download" class="loading" hidden>
      <div class="progress-bar-outer">
        <div id="model-progress" class="progress-bar-inner" style="width:0%"></div>
      </div>
      <p id="model-msg">Downloading depth model&hellip;</p>
    </section>

    <!-- Loading -->
    <section id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-msg">Measuring depth&hellip;</p>
    </section>

    <!-- Viewer -->
    <section id="viewer" class="viewer-section" hidden>
      <div id="viewer-card" class="viewer-card">
        <div id="viewer-canvas" class="viewer-canvas"></div>
        <p class="viewer-hint">Drag to spin &middot; pinch or scroll to zoom</p>
      </div>

      <div class="options-card">
        <label class="depth-label" for="depth-range">
          <span>Depth</span>
          <input id="depth-range" type="range" min="20" max="300" value="140" />
        </label>
      </div>

      <div class="viewer-actions">
        <button id="export-btn" class="export-btn">Download .PLY</button>
        <button id="reset-btn" class="reset-btn">Scan another</button>
      </div>
    </section>

    <!-- Error -->
    <section id="error" class="error-state" hidden>
      <p id="error-msg" class="error-msg"></p>
      <button id="error-back" class="reset-btn">Try again</button>
    </section>
  </main>

  <footer class="app-footer">
    <span>Powered by <a href="https://github.com/DepthAnything/Depth-Anything-V2" target="_blank" rel="noopener noreferrer">Depth Anything V2</a> &middot; <a href="https://github.com/huggingface/transformers.js" target="_blank" rel="noopener noreferrer">Transformers.js</a></span>
    <a href="/" class="home-link">&larr; Portfolio</a>
  </footer>

  <script type="module" src="./js/app.js"></script>
  <script type="module">
    import { brainOnline } from './js/config.js';
    const dot = document.getElementById('brain-dot');
    brainOnline().then((up) => {
      dot.style.background = up ? '#38b2ac' : '#e0573b';
      dot.title = up ? "Lakota's M4 is online" : "Lakota's M4 is offline — pro mode unavailable";
    });
  </script>
</body>
</html>
