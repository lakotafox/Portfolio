<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#120a20" />
  <title>3D Scanner — Capture</title>
  <meta name="description" content="Circle the object and shoot — photos stream to the reconstruction backend." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4F8;</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/lidar.css" />
  <style>
    .cap-preview { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
    .count-chip {
      position: absolute; top: 12px; right: 12px;
      background: rgba(18, 10, 32, 0.75); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 14px;
      font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .shutter-row { display: flex; align-items: center; justify-content: center; gap: 26px; margin: 18px 0 6px; }
    .shutter {
      width: 82px; height: 82px; border-radius: 50%;
      border: 4px solid rgba(167, 139, 250, 0.8);
      background: rgba(139, 92, 246, 0.25);
      cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: transform 0.08s, background 0.15s;
    }
    .shutter:active { transform: scale(0.9); background: rgba(139, 92, 246, 0.55); }
    .guide { text-align: center; color: var(--text-dim); font-size: 0.86rem; margin: 10px 0 0; }
  </style>
</head>
<body>
  <header class="app-header" style="padding-bottom:8px;">
    <h1 class="app-title" style="font-size:1.25rem;">Capture</h1>
    <p class="app-sub">Circle the object. Every angle. 30&ndash;60 shots.</p>
  </header>

  <main class="app-main" style="padding-top:6px;">
    <section id="capture">
      <div class="viz" style="margin-bottom:10px;">
        <video id="preview" class="cap-preview" autoplay muted playsinline></video>
        <span id="count" class="count-chip">0</span>
      </div>

      <div class="shutter-row">
        <button id="shutter" class="shutter" aria-label="Take photo"></button>
      </div>
      <p id="guide" class="guide">Tap the button as you slowly walk around the object.</p>

      <button id="build-btn" class="snap-btn" style="margin-top:14px;" disabled>Build 3D model (need 10+)</button>
      <p id="msg" class="capture-msg" role="alert" hidden></p>
    </section>

    <section id="building" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="build-stage">Working&hellip;</p>
      <p class="guide">Watch it appear on your paired screen &mdash; or wait here.</p>
    </section>

    <section id="done" class="error-state" hidden>
      <p class="error-msg">Model ready! &#x1F389;</p>
      <a id="view-link" class="snap-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">View it on this phone</a>
    </section>

    <section id="error" class="error-state" hidden>
      <p id="error-msg" class="error-msg"></p>
      <button id="error-back" class="reset-btn">Try again</button>
    </section>
  </main>

  <script type="module" src="./js/capture.js"></script>
</body>
</html>
