<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the tab bar can sit under the home indicator -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#14100D" />
    <meta name="color-scheme" content="dark" />
    <!-- Inline and blocking on purpose. Without it the document paints white
         for the moment between the icon-tap zoom and the CSS bundle arriving,
         and iOS flips the status bar glyphs dark to match — a full-screen
         white flash on every cold launch. The real app never goes light. -->
    <style>
      html,
      body {
        background: #14100d;
        color-scheme: dark;
      }
    </style>
    <!-- Standalone so "Add to Home Screen" launches without Safari chrome -->
    <!-- The manifest is what modern iOS actually reads for standalone mode.
         Without it the home-screen icon launches in a Safari-hosted webview
         that reserves ~47px at the bottom for a hidden toolbar, so the tab bar
         can never reach the screen edge — measured on device: screen 926,
         innerHeight 879, display-mode:standalone false. The old meta below is
         kept for older iOS, which still honours it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Really Cool Hair" />
    <title>Really Cool Hair</title>
    <link rel="preload" href="/reallycoolhair/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" crossorigin src="/reallycoolhair/app/assets/index-Cmu_XuXI.js"></script>
    <link rel="stylesheet" crossorigin href="/reallycoolhair/app/assets/index-CNeuRDNc.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
