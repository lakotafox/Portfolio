<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0a1a" />
  <title>Backlog — Issue Board</title>
  <meta name="description" content="A self-built Jira-style backlog board — draggable issue cards, priorities, labels, and story points. Built from scratch in vanilla JS." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F5C2;</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/backlog.css" />
</head>
<body>
  <div id="bg" class="bg-strands" aria-hidden="true"></div>

  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">Backlog</h1>
      <span class="project-badge">PORT</span>
    </div>
    <div class="header-stats">
      <div class="stat"><span id="stat-total" class="stat-num">0</span><span class="stat-label">issues</span></div>
      <div class="stat"><span id="stat-done" class="stat-num">0</span><span class="stat-label">done</span></div>
      <div class="stat"><span id="stat-points" class="stat-num">0</span><span class="stat-label">pts left</span></div>
    </div>
  </header>

  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Search issues…" aria-label="Search issues" />
    <div class="toolbar-actions">
      <button id="reset-btn" class="ghost-btn" title="Reset to starter backlog">Reset</button>
      <button id="new-btn" class="primary-btn"><span class="specular-button__label-fallback">+ New issue</span></button>
    </div>
  </div>

  <main class="board-wrap">
    <div id="board" class="board"></div>
  </main>

  <footer class="app-footer">
    <span>Built from scratch · vanilla JS · drag-and-drop via <a href="https://github.com/SortableJS/Sortable" target="_blank" rel="noopener noreferrer">SortableJS</a></span>
    <a href="/" class="home-link">&larr; Portfolio</a>
  </footer>

  <!-- Create / edit modal -->
  <div id="modal" class="modal" hidden>
    <form id="issue-form" class="modal-card" autocomplete="off">
      <div class="modal-head">
        <div>
          <span id="modal-key" class="modal-key">PORT-1</span>
          <h2 id="modal-title" class="modal-heading">New issue</h2>
        </div>
        <button type="button" id="modal-cancel" class="modal-close" aria-label="Close">&times;</button>
      </div>

      <label class="field">
        <span class="field-label">Title</span>
        <input id="f-title" class="field-input" type="text" required placeholder="Short summary" />
      </label>

      <label class="field">
        <span class="field-label">Description</span>
        <textarea id="f-description" class="field-input" rows="3" placeholder="Details, acceptance criteria…"></textarea>
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-label">Type</span>
          <select id="f-type" class="field-input"></select>
        </label>
        <label class="field">
          <span class="field-label">Priority</span>
          <select id="f-priority" class="field-input"></select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field-label">Status</span>
          <select id="f-status" class="field-input"></select>
        </label>
        <label class="field">
          <span class="field-label">Story points</span>
          <input id="f-points" class="field-input" type="number" min="0" step="1" placeholder="—" />
        </label>
      </div>

      <label class="field">
        <span class="field-label">Labels <em>(comma-separated)</em></span>
        <input id="f-labels" class="field-input" type="text" placeholder="bird-id, ux" />
      </label>

      <div class="modal-actions">
        <button type="button" id="modal-delete" class="danger-btn" hidden>Delete</button>
        <div class="modal-actions-right">
          <button type="button" id="modal-cancel-2" class="ghost-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </div>
    </form>
  </div>

  <script src="./js/vendor/sortable.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
