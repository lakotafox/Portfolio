<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LennyHouse · Portland cat-friendly apartments under $2,200</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/600.css">
<style>
  :root {
    --background: #f5f5f5;
    --foreground: #0a0a0a;
    --muted: #f5f5f5;
    --muted-foreground: #737373;
    --border: #e5e5e5;
    --ring: #0066ff;
    --frame: #ffffff;
    --accent: #a8d946;
    --card-primary: #a8d946;
    --card-secondary: #e8f5c8;
    --card-foreground: #171717;
    --card-foreground-muted: #525252;
    --surface: #ffffff;
    --font-sans: "Geist Sans", system-ui, -apple-system, sans-serif;
  }
  .dark {
    --background: #141414;
    --foreground: #fafafa;
    --muted: #171717;
    --muted-foreground: #a3a3a3;
    --border: #262626;
    --ring: #3b82f6;
    --frame: #000;
    --card-secondary: #2a3a1a;
    --card-foreground: #fafafa;
    --card-foreground-muted: #d4d4d4;
    --surface: #1c1c1c;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: light; scroll-behavior: smooth; }
  html.dark { color-scheme: dark; }
  ::selection { background-color: var(--accent); color: #fff; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── Site frame + corners (from template) ─────────────────── */
  .site-frame { position: fixed; z-index: 9999; pointer-events: none; background: var(--frame); }
  .site-frame--top { top: 0; left: 0; right: 0; height: 10px; }
  .site-frame--bottom { bottom: 0; left: 0; right: 0; height: 10px; }
  .site-frame--left { top: 0; left: 0; bottom: 0; width: 10px; }
  .site-frame--right { top: 0; right: 0; bottom: 0; width: 10px; }
  .site-corner { position: fixed; z-index: 9998; pointer-events: none; color: var(--frame); }
  .site-corner--top-left { top: 10px; left: 10px; transform: rotate(90deg); }
  .site-corner--top-right { top: 10px; right: 10px; transform: rotate(180deg); }
  .site-corner--bottom-left { bottom: 10px; left: 10px; }
  .site-corner--bottom-right { bottom: 10px; right: 10px; transform: rotate(270deg); }
  @media (max-width: 850px) { .site-frame, .site-corner { display: none; } }

  /* ── Hero ─────────────────────────────────────────────────── */
  .hero { position: relative; padding: 96px 24px 72px; text-align: center; color-scheme: light; }
  .hero-bg {
    position: absolute; inset: 10px 10px 0 10px; z-index: -1;
    background: url('assets/BG.jpg') center/cover no-repeat;
    filter: brightness(1.25);
    border-radius: 0 0 2rem 2rem;
  }
  @media (max-width: 850px) { .hero { padding: 64px 20px 48px; } .hero-bg { inset: 0; border-radius: 0; } }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px 6px 16px; border-radius: 12px;
    border: 1px solid rgba(0,0,0,.1); background: #fff; color: #000;
    font-size: 14px; font-weight: 500; margin-bottom: 24px;
  }
  .hero-badge .spark { color: var(--accent); }
  .hero h1 {
    font-size: clamp(40px, 7vw, 76px);
    font-weight: 500; letter-spacing: -0.03em; line-height: 1.08;
    color: #000; margin-bottom: 18px;
  }
  .hero h1 .fancy { font-style: italic; font-family: Georgia, "Times New Roman", serif; color: #5a7d1e; }
  .hero p.sub { font-size: 18px; color: #3d3d3d; margin-bottom: 26px; }
  .hero-cta {
    display: inline-flex; align-items: center; position: relative; cursor: pointer;
    text-decoration: none; border: none; background: none; padding: 0; font: inherit;
    transition: transform .2s ease;
  }
  .hero-cta:hover { transform: scale(1.02); }
  .hero-cta .tail-bg { position: absolute; right: 0; top: 0; bottom: 0; width: calc(100% - 2rem); border-radius: 12px; background: var(--accent); }
  .hero-cta .label { position: relative; z-index: 1; padding: 12px 24px; border-radius: 12px; background: #000; color: #fff; font-weight: 500; }
  .hero-cta .arrow {
    position: relative; z-index: 1; width: 44px; height: 44px; display: flex;
    align-items: center; justify-content: center; color: #000;
  }
  .hero-cta .arrow svg { transition: transform .3s ease; }
  .hero-cta:hover .arrow svg { transform: rotate(-45deg); }

  /* ── Filter bar ───────────────────────────────────────────── */
  .toolbar-wrap { position: sticky; top: 10px; z-index: 1100; padding: 14px 24px; }
  .toolbar {
    max-width: 1280px; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
    font-size: 14px;
  }
  .toolbar input[type="search"] {
    padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px;
    min-width: 210px; font-size: 14px; background: var(--muted); color: var(--foreground);
    font-family: inherit; outline: none;
  }
  .toolbar input[type="search"]:focus-visible, .toolbar select:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .toolbar label { display: flex; align-items: center; gap: 8px; color: var(--foreground); font-weight: 500; }
  .toolbar select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--muted); color: var(--foreground); font-size: 14px; font-family: inherit;
  }
  .toolbar input[type="range"] { accent-color: #5a7d1e; }
  .toolbar input[type="checkbox"] { accent-color: #5a7d1e; }
  .price-val { font-weight: 600; color: #5a7d1e; min-width: 54px; font-variant-numeric: tabular-nums; }
  .dark .price-val, .dark .hero h1 .fancy { color: var(--accent); }
  .count { margin-left: auto; color: var(--muted-foreground); font-size: 13px; }

  /* ── Content: grid + map ──────────────────────────────────── */
  main { max-width: 1280px; margin: 0 auto; padding: 10px 24px 80px; display: grid; grid-template-columns: minmax(0,1fr) 42%; gap: 20px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); grid-auto-rows: max-content; gap: 18px; align-content: start; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  .card:hover, .card.active { box-shadow: 0 10px 32px rgba(0,0,0,.10); transform: translateY(-3px); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 10px 32px rgba(0,0,0,.10); }
  .card img { width: 100%; height: 158px; object-fit: cover; background: var(--muted); }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .card .addr { color: var(--muted-foreground); font-size: 12.5px; line-height: 1.4; }
  .card .price { font-weight: 600; color: #5a7d1e; font-size: 15px; }
  .dark .card .price { color: var(--accent); }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--card-secondary); color: var(--card-foreground);
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; width: fit-content;
  }
  .card .links { margin-top: auto; padding-top: 10px; display: flex; gap: 10px; align-items: center; }
  .view-btn {
    display: inline-flex; align-items: center; position: relative;
    text-decoration: none; font-size: 13px; font-weight: 500;
  }
  .view-btn .tail-bg { position: absolute; right: 0; top: 0; bottom: 0; width: calc(100% - 1rem); border-radius: 9px; background: var(--accent); }
  .view-btn .label { position: relative; z-index: 1; padding: 7px 12px; border-radius: 9px; background: #000; color: #fff; }
  .dark .view-btn .label { background: #fafafa; color: #0a0a0a; }
  .view-btn .arrow { position: relative; z-index: 1; width: 26px; height: 28px; display: flex; align-items: center; justify-content: center; color: #000; }
  .view-btn .arrow svg { transition: transform .3s ease; width: 13px; height: 13px; }
  .view-btn:hover .arrow svg { transform: rotate(-45deg); }
  .card .phone { color: var(--muted-foreground); font-size: 12px; }
  .empty { color: var(--muted-foreground); padding: 48px; font-size: 15px; grid-column: 1 / -1; text-align: center; }

  #mapPanel { position: sticky; top: 88px; height: calc(100vh - 108px); border-radius: 18px; overflow: hidden; border: 1px solid var(--border); }
  #mapPanel.map-full { position: fixed; inset: 0; z-index: 12000; height: 100vh; height: 100dvh; border-radius: 0; border: none; }
  body.map-locked { overflow: hidden; }
  #map { height: 100%; background: var(--muted); }
  .map-fs-btn {
    position: absolute; top: 12px; right: 12px; z-index: 1001;
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--foreground);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .map-fs-btn:hover { background: var(--muted); }
  .map-fs-btn svg { width: 18px; height: 18px; }
  .map-fs-btn .compress, .map-full .map-fs-btn .expand { display: none; }
  .map-full .map-fs-btn .compress { display: block; }
  .mobile-map-btn {
    display: none; position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 10000; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; border: none; cursor: pointer;
    background: #000; color: #fff; font: inherit; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .mobile-map-btn .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
  .dark .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
  .dark .leaflet-container { background: #111; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--foreground); }
  .leaflet-popup-content { font-size: 13px; line-height: 1.45; font-family: var(--font-sans); }
  .leaflet-popup-content b { font-size: 14px; }
  .leaflet-popup-content a { color: #5a7d1e; font-weight: 600; }
  .dark .leaflet-popup-content a { color: var(--accent); }
  .leaflet-popup-content img { width: 100%; border-radius: 8px; margin-top: 6px; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; padding: 10px 14px 96px; }
    #mapPanel { display: none; }
    #mapPanel.map-full { display: block; }
    .mobile-map-btn { display: inline-flex; }
    .toolbar-wrap { padding: 10px 12px; top: 0; }
    .toolbar { gap: 10px; padding: 10px 14px; }
    .toolbar input[type="search"] { flex: 1; min-width: 140px; }
    .toolbar input[type="range"] { width: 110px; }
    .count { flex-basis: 100%; margin-left: 0; text-align: right; }
    .theme-toggle { bottom: 22px; right: 14px; }
  }

  /* ── Theme toggle ─────────────────────────────────────────── */
  .theme-toggle {
    position: fixed; right: 22px; bottom: 22px; z-index: 10000;
    width: 44px; height: 44px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--foreground);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    transition: transform .2s ease;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle svg { width: 19px; height: 19px; }
  .theme-toggle .moon { display: none; }
  .dark .theme-toggle .sun { display: none; }
  .dark .theme-toggle .moon { display: block; }

  footer {
    max-width: 1280px; margin: 0 auto; padding: 0 24px 40px;
    color: var(--muted-foreground); font-size: 12.5px; text-align: center;
  }
</style>
</head>
<body>
<div class="site-frame site-frame--top" aria-hidden="true"></div>
<div class="site-frame site-frame--bottom" aria-hidden="true"></div>
<div class="site-frame site-frame--left" aria-hidden="true"></div>
<div class="site-frame site-frame--right" aria-hidden="true"></div>
<svg class="site-corner site-corner--top-left" width="50" height="50" viewBox="0 0 50 50" fill="none" aria-hidden="true"><path d="M5.50871e-06 0C-0.00788227 37.3001 8.99616 50.0116 50 50H5.50871e-06V0Z" fill="currentColor"/></svg>
<svg class="site-corner site-corner--top-right" width="50" height="50" viewBox="0 0 50 50" fill="none" aria-hidden="true"><path d="M5.50871e-06 0C-0.00788227 37.3001 8.99616 50.0116 50 50H5.50871e-06V0Z" fill="currentColor"/></svg>
<svg class="site-corner site-corner--bottom-left" width="50" height="50" viewBox="0 0 50 50" fill="none" aria-hidden="true"><path d="M5.50871e-06 0C-0.00788227 37.3001 8.99616 50.0116 50 50H5.50871e-06V0Z" fill="currentColor"/></svg>
<svg class="site-corner site-corner--bottom-right" width="50" height="50" viewBox="0 0 50 50" fill="none" aria-hidden="true"><path d="M5.50871e-06 0C-0.00788227 37.3001 8.99616 50.0116 50 50H5.50871e-06V0Z" fill="currentColor"/></svg>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<section class="hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="hero-badge">Portland, OR · Under $2,200 <span class="spark">✦</span></div>
  <h1>Find a place<br>you &amp; your <span class="fancy">cat</span> will love</h1>
  <p class="sub">40 cat-friendly apartments, hand-scraped fresh from Apartments.com</p>
  <a class="hero-cta" href="#listings">
    <span class="tail-bg"></span>
    <span class="label">Browse Listings</span>
    <span class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7v10H7"/></svg></span>
  </a>
</section>

<div class="toolbar-wrap" id="listings">
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search name or address…">
    <label>Max price
      <input id="maxPrice" type="range" min="1000" max="2200" step="50" value="2200">
      <span class="price-val" id="maxPriceVal">$2,200</span>
    </label>
    <label><input id="catOnly" type="checkbox" checked> Cat friendly</label>
    <select id="sort">
      <option value="default">Sort: featured</option>
      <option value="asc">Price: low → high</option>
      <option value="desc">Price: high → low</option>
      <option value="name">Name A–Z</option>
    </select>
    <span class="count" id="count"></span>
  </div>
</div>

<main>
  <div id="list"></div>
  <div id="mapPanel">
    <div id="map"></div>
    <button class="map-fs-btn" id="mapFsBtn" aria-label="Toggle fullscreen map">
      <svg class="expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      <svg class="compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
    </button>
  </div>
</main>

<button class="mobile-map-btn" id="mobileMapBtn"><span class="dot"></span> Map</button>

<footer>Data scraped from Apartments.com on Aug 1, 2026 · prices &amp; availability change fast — verify with the property. Map © OpenStreetMap contributors.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// theme
// dark by default; only an explicit user choice of light overrides it
if (localStorage.getItem('lh-theme') !== 'light') {
  document.documentElement.classList.add('dark');
}

// horse neigh every 10s. Prefetched as a blob (some Chromes defer media-element
// network loads indefinitely); playback still needs one user interaction first.
const neighUrl = fetch('assets/horse-neigh.mp3')
  .then(r => r.blob()).then(b => URL.createObjectURL(b)).catch(() => null);
let neigh = null, neighing = false;
async function startNeighing() {
  if (neighing) return;
  neighing = true;
  const url = await neighUrl;
  if (!url) { neighing = false; return; }
  neigh = new Audio(url);
  neigh.volume = 0.6;
  neigh.play().catch(() => {});
  setInterval(() => { neigh.currentTime = 0; neigh.play().catch(() => {}); }, 10000);
}
['pointerdown', 'click', 'touchstart', 'keydown'].forEach(ev =>
  addEventListener(ev, startNeighing, { once: true, capture: true }));
document.getElementById('themeToggle').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('lh-theme', dark ? 'dark' : 'light');
});

let DATA = [];
let markers = {};
const map = L.map('map').setView([45.52, -122.67], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const fmt = n => '$' + n.toLocaleString();
const els = {
  q: document.getElementById('q'),
  max: document.getElementById('maxPrice'),
  maxVal: document.getElementById('maxPriceVal'),
  cat: document.getElementById('catOnly'),
  sort: document.getElementById('sort'),
  list: document.getElementById('list'),
  count: document.getElementById('count'),
};

function filtered() {
  const q = els.q.value.trim().toLowerCase();
  const max = +els.max.value;
  let rows = DATA.filter(r =>
    (!q || (r.name + ' ' + r.address).toLowerCase().includes(q)) &&
    (r.minPrice == null || r.minPrice <= max) &&
    (!els.cat.checked || r.catFriendly)
  );
  const s = els.sort.value;
  if (s === 'asc') rows = rows.slice().sort((a, b) => (a.minPrice ?? 9e9) - (b.minPrice ?? 9e9));
  if (s === 'desc') rows = rows.slice().sort((a, b) => (b.minPrice ?? 0) - (a.minPrice ?? 0));
  if (s === 'name') rows = rows.slice().sort((a, b) => a.name.localeCompare(b.name));
  return rows;
}

function render() {
  const rows = filtered();
  els.maxVal.textContent = fmt(+els.max.value);
  els.count.textContent = rows.length + ' of ' + DATA.length + ' listings';
  els.list.innerHTML = rows.length ? '' : '<div class="empty">No listings match — raise the max price or clear the search.</div>';

  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const bounds = [];
  rows.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + r.id;
    card.innerHTML = `
      <img src="${r.img}" alt="${r.name}" loading="lazy" onerror="this.style.display='none'">
      <div class="body">
        <h3>${r.name}</h3>
        <div class="addr">${r.address}</div>
        <div class="price">${r.priceText || 'Call for price'}</div>
        ${r.catFriendly ? '<span class="badge">🐱 Cat friendly</span>' : ''}
        <div class="links">
          <a class="view-btn" href="${r.url}" target="_blank" rel="noopener">
            <span class="tail-bg"></span><span class="label">View listing</span>
            <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7v10H7"/></svg></span>
          </a>
          <span class="phone">${r.phone || ''}</span>
        </div>
      </div>`;
    card.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      focusListing(r, true);
    });
    els.list.appendChild(card);

    if (r.lat && r.lng) {
      const mk = L.marker([r.lat, r.lng]).addTo(map);
      mk.bindPopup(
        `<b>${r.name}</b><br>${r.priceText}<br>${r.address}<br>` +
        `<a href="${r.url}" target="_blank" rel="noopener">View on Apartments.com ↗</a>` +
        `<img src="${r.img}" loading="lazy">`
      );
      mk.on('click', () => focusListing(r, false));
      markers[r.id] = mk;
      bounds.push([r.lat, r.lng]);
    }
  });
  lastBounds = bounds;
  if (bounds.length && mapPanel.offsetWidth > 0) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
}

let lastBounds = [];
const mapPanel = document.getElementById('mapPanel');
function toggleMapFull(force) {
  const on = mapPanel.classList.toggle('map-full', force);
  document.body.classList.toggle('map-locked', on);
  setTimeout(() => {
    map.invalidateSize();
    if (on && lastBounds.length) map.fitBounds(lastBounds, { padding: [30, 30], maxZoom: 14 });
  }, 60);
}
document.getElementById('mapFsBtn').addEventListener('click', () => toggleMapFull());
document.getElementById('mobileMapBtn').addEventListener('click', () => toggleMapFull(true));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && mapPanel.classList.contains('map-full')) toggleMapFull(false);
});

function focusListing(r, pan) {
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + r.id);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  const mk = markers[r.id];
  if (mk) { if (pan) map.panTo(mk.getLatLng()); mk.openPopup(); }
}

['input', 'change'].forEach(ev => {
  els.q.addEventListener(ev, render);
  els.max.addEventListener(ev, render);
  els.cat.addEventListener(ev, render);
  els.sort.addEventListener(ev, render);
});

fetch('data/listings.json')
  .then(r => r.json())
  .then(rows => {
    DATA = rows.map((r, i) => ({ ...r, id: i }));
    render();
  })
  .catch(() => {
    els.list.innerHTML = '<div class="empty">Could not load data/listings.json — serve this folder over http (not file://).</div>';
  });
</script>
</body>
</html>
