[build]
  command = "npm run build"
  publish = "dist"

# Pretty URLs rewrote ./scan.html links to extensionless /lidar/scan, which
# broke the 3D Scanner's QR URL construction. Never let Netlify rewrite HTML.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"

# Plant Identifier API proxy (holds the Pl@ntNet key server-side).
# MUST come before the SPA catch-all or it gets swallowed.
[[redirects]]
  from = "/api/identify"
  to = "/.netlify/functions/identify"
  status = 200
  force = true

# Plant Identifier app: clean URL -> its static folder (mirrors /redwoods).
[[redirects]]
  from = "/plant-id"
  to = "/plant-id/"
  status = 302
  force = true

# Bird Song ID app: clean URL -> its static folder.
[[redirects]]
  from = "/bird-id"
  to = "/bird-id/"
  status = 302
  force = true

# Backlog issue board: clean URL -> its static folder.
[[redirects]]
  from = "/backlog"
  to = "/backlog/"
  status = 302
  force = true

# Root "/" stays the portfolio (React SPA index.html). The livestream demo
# landing lives at /free instead.
[[redirects]]
  from = "/free"
  to = "/demo.html"
  status = 200
  force = true

# Livestream guest pages: clean URLs -> their static .html files.
# These must come BEFORE the SPA catch-all or it swallows them.
[[redirects]]
  from = "/fred"
  to = "/fred.html"
  status = 200
  force = true

[[redirects]]
  from = "/games"
  to = "/games.html"
  status = 200
  force = true

[[redirects]]
  from = "/tank"
  to = "/tank.html"
  status = 200
  force = true

[[redirects]]
  from = "/battle"
  to = "/battle.html"
  status = 200
  force = true

[[redirects]]
  from = "/watts"
  to = "/watts/"
  status = 302
  force = true

[[redirects]]
  from = "/redwoods"
  to = "/redwoods/"
  status = 302
  force = true

# LennyHouse apartment finder: clean URL -> its static folder.
[[redirects]]
  from = "/lennyhouse"
  to = "/lennyhouse/"
  status = 302
  force = true

# Puddl3 API proxy. The app calls /puddl3-api/... on this domain and Netlify
# forwards it to the backend, so the browser only ever makes a same-origin
# request: no CORS preflight, no ngrok browser interstitial, and none of
# Safari's cross-site cookie rules apply. Calling the backend directly worked
# in Chrome but failed in Safari with "Load failed"; this sidesteps all of it.
# MUST come before the SPA catch-all.
[[redirects]]
  from = "/puddl3-api/*"
  to = "/.netlify/functions/puddl3-api/:splat"
  status = 200
  force = true

# Puddl3 payroll app (Next.js static export, basePath /puddl3).
[[redirects]]
  from = "/puddl3"
  to = "/puddl3/"
  status = 302
  force = true

# Really Cool Hair — salon site, owner dashboard and phone app, built from the
# reallycoolhair repo with RCH_BASE=/reallycoolhair and copied into public/.
# The live salon site at reallycoolhair.com is a separate deploy and is not
# affected by anything here.
#
# The booking flow talks to the salon's own database over Tailscale, so it only
# works from a device on that tailnet with the salon machine awake. Browsing
# works for anyone; booking will not.
#
# Both sub-apps are SPAs and need their own catch-all ABOVE the portfolio's,
# or a deep link falls through to the portfolio shell.
[[redirects]]
  from = "/reallycoolhair/admin/*"
  to = "/reallycoolhair/admin/index.html"
  status = 200

[[redirects]]
  from = "/reallycoolhair/app/*"
  to = "/reallycoolhair/app/index.html"
  status = 200

# Clean URL -> its static folder, same as the other projects above.
[[redirects]]
  from = "/reallycoolhair"
  to = "/reallycoolhair/"
  status = 302
  force = true

# GifCities search proxy for Gifsmith (no API/CORS upstream; the client
# parses the HTML). MUST come before the SPA catch-all.
[[redirects]]
  from = "/gifsmith-api/search"
  to = "/.netlify/functions/gifcities-search"
  status = 200
  force = true

# Gifsmith app: clean URL -> its static folder (mirrors /plant-id etc).
[[redirects]]
  from = "/gifsmith"
  to = "/gifsmith/"
  status = 302
  force = true

# Portfolio (React SPA) is served at /portfolio and all other app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
